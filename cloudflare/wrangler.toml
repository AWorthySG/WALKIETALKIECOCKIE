name = "relay-walkie-api"
main = "worker.js"
compatibility_date = "2026-10-15"

[build]
# Wrangler resolves cwd from where it is started; run it from cloudflare/ (npm run deploy does this).
cwd = ".."
command = "npm run build"

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "RELAY_STATE"
class_name = "RelayState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayState"]
